<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>APRSNETCN OA 主控台</title>
<style>
:root{--bg:#f2f0ea;--card:#ffffff;--text:#15181c;--grey:#6b7280;--line:#d8d5cd;--hot:#b3141f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Helvetica Neue",Helvetica,Arial,"Noto Sans SC",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 8px;letter-spacing:.04em}
p.note{color:var(--grey);font-size:13px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;background:var(--card);border:1px solid var(--line);padding:10px 12px;font-size:13px}
.bar b{font-weight:600}
.ok{color:#137a3f}
.bad{color:var(--hot)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--grey);font-size:12px}
tr:last-child td{border-bottom:0}
td.mono,th.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.k{display:inline-block;padding:0 5px;border:1px solid var(--line);font-size:11px}
.k.cq{color:var(--hot);border-color:var(--hot)}
form.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);padding:10px}
label{display:block;font-size:11px;color:var(--grey)}
input,select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);background:#fff;color:var(--text);min-width:90px}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--text);background:#fff;color:var(--text);cursor:pointer}
button.hot{border-color:var(--hot);color:var(--hot)}
button.on{background:var(--hot);border-color:var(--hot);color:#fff}
button.mini{padding:1px 7px;font-size:12px}
.empty{color:var(--grey);font-size:13px;padding:10px 2px}
.err{background:#fdecec;border:1px solid var(--hot);color:var(--hot);padding:8px 10px;font-size:13px;margin:12px 0}
.hint{color:var(--grey);font-size:12px}
.msg{font-size:13px;color:var(--grey);margin:8px 0 0}
.msg.ok{color:#137a3f}
.msg.bad{color:var(--hot)}
p.note label{display:inline}
p.note input[type=checkbox]{min-width:0;width:auto;padding:0;border:0;background:none;vertical-align:-1px}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>APRSNETCN OA 主控台</h1>
  <p class="note">收到的 CNNET 报文在这里点名。名单改完自动写进本轮，页面上看到的就是这份。
    <label class="hint"><input type="checkbox" id="auto"> 全自动</label>
    <span id="ago"></span> <label class="hint"><input type="checkbox" id="pause"> 暂停刷新</label></p>

  <div class="bar" id="bar"><span>正在读状态…</span></div>
  <div class="bar" id="stats" style="margin-top:8px"><span>本轮还没有台站。</span></div>

  <div id="err"></div>

  <h2>轮次</h2>
  <form class="row" id="roundForm">
    <div><label>本轮日期</label><input type="date" id="roundDate"></div>
    <div><label>轮值呼号</label><input type="text" id="dutyCall" placeholder="BG7LZQ-2"></div>
    <div><button type="submit">开这一轮</button></div>
    <div><button type="button" id="closeRound">结束这一轮</button></div>
    <div><label>看哪一轮</label><select id="roundPick"></select></div>
    <div><button type="button" id="archBtn">归档本轮</button></div>
    <div><a href="#" id="exportBtn"><button type="button">roster.json</button></a></div>
    <div><a href="#" id="csvStBtn"><button type="button">名单 CSV</button></a></div>
    <div><a href="#" id="csvPktBtn"><button type="button">报文 CSV</button></a></div>
  </form>
  <div id="msg" class="msg"></div>

  <h2>待办</h2>
  <p class="note" id="todoNote">回了 ACK 还在等对方回 U，和只喊到还没回的，都列在这里。</p>
  <div id="todo"></div>

  <h2>报到流水（最近 200 条）</h2>
  <p class="note">CQ 是喊到，U 是确认。加入本轮会把这一台补进名单，回 ACK 是回复它。</p>
  <div id="packets"></div>

  <h2>本轮名单</h2>
  <div id="stations"></div>

  <h2>发件箱</h2>
  <p class="note">回出去的 ACK 都记在这里。发失败的那条会带一句原因。</p>
  <div id="outbox"></div>

  <h2>手动加一台</h2>
  <form class="row" id="stForm">
    <div><label>呼号</label><input type="text" id="stCall" placeholder="BG7XXX-9"></div>
    <div><label>网格</label><input type="text" id="stGrid" placeholder="OL62"></div>
    <div><label>路径</label><select id="stVia"><option value="rf">射频</option><option value="is">网络</option><option value="">空着</option></select></div>
    <div><label>中继（逗号隔开）</label><input type="text" id="stDigi" placeholder="BG7LZQ-1"></div>
    <div><label>时间（MM-DD HH:MM）</label><input type="text" id="stAt" placeholder="10-17 15:04"></div>
    <div><label>状态</label><select id="stStatus"><option value="confirmed">已确认</option><option value="acked">已回 ACK</option><option value="called">只喊到</option></select></div>
    <div><button type="submit">写进名单</button></div>
  </form>
  <p class="hint" id="txHint"></p>
</div>
<script>
(function () {
  "use strict";
  var token = "";
  var hit = /(?:^|[?&])token=([^&]+)/.exec(location.search);
  if (hit) {
    token = decodeURIComponent(hit[1]);
    try { localStorage.setItem("oa_token", token); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  } else {
    try { token = localStorage.getItem("oa_token") || ""; } catch (e) { token = ""; }
  }
  if (!token) {
    token = prompt("主控口令（OA_ADMIN_TOKEN）") || "";
    try { localStorage.setItem("oa_token", token); } catch (e) {}
  }

  var state = { date: "", round: "", archive: "", auto: false, routes: [] };
  var lastSync = 0;
  var $ = function (id) { return document.getElementById(id); };

  var showErr = function (msg) {
    var box = $("err");
    box.textContent = "";
    if (!msg) return;
    var div = document.createElement("div");
    div.className = "err";
    div.textContent = msg;
    box.appendChild(div);
  };

  var sayTimer = 0;

  var say = function (text, bad) {
    var box = $("msg");
    box.textContent = text || "";
    box.className = text ? ("msg " + (bad ? "bad" : "ok")) : "msg";
    if (sayTimer) clearTimeout(sayTimer);
    if (text) {
      sayTimer = setTimeout(function () {
        box.textContent = "";
        box.className = "msg";
      }, 8000);
    }
  };

  var api = function (path, method, body) {
    var url = path + (path.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(token);
    return fetch(url, {
      method: method || "GET",
      headers: { "X-OA-Token": token, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    }).then(function (r) { return r.json(); });
  };

  var bjTime = function (iso) {
    if (!iso) return "";
    var t = Date.parse(iso);
    if (!t) return String(iso);
    return new Date(t + 8 * 3600 * 1000).toISOString().slice(5, 16).replace("T", " ");
  };

  var cell = function (tr, text, cls) {
    var td = document.createElement("td");
    if (cls) td.className = cls;
    if (text !== undefined && text !== null) td.textContent = String(text);
    tr.appendChild(td);
    return td;
  };

  var copy = function (text, btn) {
    var done = function () {
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = "已复制";
      setTimeout(function () { btn.textContent = old; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt("复制这行", text); });
      return;
    }
    window.prompt("复制这行", text);
  };

  var refresh = function () {
    var url = "/api/admin/state" + (state.date ? "?date=" + encodeURIComponent(state.date) : "");
    return api(url).then(function (data) {
      showErr(data && data.error ? data.error : "");
      if (!data || !data.ok) return;
      state.routes = (data.packets || []).slice(0, 200);
      state.round = (data.round && data.round.date) || "";
      state.archive = (data.health && data.health.archive_dir) || "";
      state.auto = !!(data.health && data.health.auto);
      lastSync = Date.now();
      paintBar(data.health, data.round);
      paintStats(data.stats, data.round);
      paintRounds(data.rounds, data.round);
      paintTodo(data.stations, data.round);
      paintPackets(data.packets);
      paintStations(data.stations, data.round);
      paintOutbox(data.outbox);
    });
  };

  var paintStats = function (s, round) {
    var box = $("stats");
    box.textContent = "";
    if (!round || !s) {
      var p = document.createElement("span");
      p.textContent = "本轮还没有台站。";
      box.appendChild(p);
      return;
    }
    var add = function (label, value) {
      var span = document.createElement("span");
      var b = document.createElement("b");
      b.textContent = label;
      span.appendChild(b);
      span.appendChild(document.createTextNode(" " + value));
      box.appendChild(span);
    };
    add("台站", s.stations);
    add("已确认", s.confirmed);
    add("已回 ACK", s.acked);
    add("只喊到", s.called);
    add("射频", s.rf);
    add("网络", s.is);
    add("中继", s.digis);
    add("本轮报文", s.packets);
    add("最后一条", bjTime(s.last) || "—");
  };

  var paintTodo = function (stations, round) {
    var box = $("todo");
    box.textContent = "";
    $("todoNote").textContent = state.auto
      ? "全自动开着：喊到自己就回 ACK，漏了的过一分钟自己补。这里只列还没回上 ACK 的。"
      : "回了 ACK 还在等对方回 U，和只喊到还没回的，都列在这里。";
    var waiting = (stations || []).filter(function (s) {
      return state.auto ? s.status === "called" : s.status !== "confirmed";
    });
    if (!round || !waiting.length) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = round ? (state.auto ? "没有要人动的。" : "都确认了。") : "先开一轮。";
      box.appendChild(p);
      return;
    }
    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["呼号", "现在", "等什么", ""].forEach(function (label) {
      var th = document.createElement("th");
      th.textContent = label;
      head.appendChild(th);
    });
    table.appendChild(head);
    waiting.forEach(function (s) {
      var tr = document.createElement("tr");
      cell(tr, s.call, "mono");
      cell(tr, s.status === "acked" ? "已回 ACK" : "只喊到");
      cell(tr, s.status === "acked" ? "等它回 U CNNET" : "还没回 ACK");
      var ops = cell(tr);
      if (s.status !== "acked") {
        var ack = document.createElement("button");
        ack.type = "button";
        ack.className = "mini";
        ack.textContent = "回 ACK";
        ack.onclick = function () { doAck(s.call, ack); };
        ops.appendChild(ack);
      } else {
        var up = document.createElement("button");
        up.type = "button";
        up.className = "mini";
        up.textContent = "标已确认";
        up.onclick = function () {
          api("/api/admin/station", "POST", { date: state.date, call: s.call, status: "confirmed" })
            .then(function (d) { showErr(d && d.error); refresh(); });
        };
        ops.appendChild(up);
      }
      table.appendChild(tr);
    });
    box.appendChild(table);
  };

  var paintBar = function (h, round) {
    var bar = $("bar");
    bar.textContent = "";
    var aprs = (h && h.aprs) || {};
    var add = function (label, value, cls) {
      var span = document.createElement("span");
      var b = document.createElement("b");
      b.textContent = label;
      span.appendChild(b);
      span.appendChild(document.createTextNode(" " + value));
      if (cls) span.className = cls;
      bar.appendChild(span);
    };
    var online = aprs.state === "online";
    add("APRS-IS", online ? "在线" : (aprs.state || "断"), online ? "ok" : "bad");
    add("收到", (aprs.lines || 0) + " 行");
    add("最后一行", bjTime(aprs.last) || "—");
    add("本轮", (round && round.date) || "没开");
    add("在收的轮", (h && h.active_round) || "没开");
    add("报文", (h && h.packets) || 0);
    add("发 ACK", (h && h.tx) ? "能发" : "只记不发");
    add("全自动", (h && h.auto) ? "开" : "关", (h && h.auto) ? "ok" : "");
    if (h && h.tx) add("自动回 ACK", h.auto_ack ? "开" : "关");
    if (aprs.error) add("错误", aprs.error, "bad");
    $("auto").checked = !!(h && h.auto);
    $("txHint").textContent = (h && h.tx)
      ? ((h.auto_ack ? "有人喊到就自动回一条 ACK。" : "自动回 ACK 关着，只能自己点。") +
         (h.auto ? "没回成的过一分钟自己补，一台最多补 " + (h.ack_retry || 0) + " 次。" : "") +
         "一台一轮只回一次，一分钟最多 " + (h.ack_per_minute || 12) + " 条。")
      : "没有配 OA_TX_PASSCODE，回 ACK 只把报文记下来、复制给你自己发。";
  };

  var paintRounds = function (rounds, round) {
    var pick = $("roundPick");
    pick.textContent = "";
    (rounds || []).forEach(function (r) {
      var opt = document.createElement("option");
      opt.value = r.date;
      opt.textContent = r.date + (r.active ? "（在收）" : "");
      pick.appendChild(opt);
    });
    if (round) {
      $("roundDate").value = round.date;
      $("dutyCall").value = round.duty || "";
      pick.value = round.date;
    } else if (!$("roundDate").value) {
      var today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
      $("roundDate").value = today;
    }
  };

  var paintPackets = function (packets) {
    var box = $("packets");
    box.textContent = "";
    var rows = (packets || []).filter(function (p) { return p.kind !== "other"; });
    if (!rows.length) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = "还没有 CNNET 报文。";
      box.appendChild(p);
      return;
    }
    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["时间", "呼号", "类型", "网格", "路径", "报文", ""].forEach(function (label, i) {
      var th = document.createElement("th");
      th.textContent = label;
      if (i === 5) th.className = "mono";
      head.appendChild(th);
    });
    table.appendChild(head);
    rows.forEach(function (p) {
      var tr = document.createElement("tr");
      cell(tr, bjTime(p.ts), "mono");
      cell(tr, p.src, "mono");
      var kind = cell(tr, p.kind === "cq" ? "喊到" : (p.kind === "u" ? "确认" : p.kind));
      kind.className = "k " + p.kind;
      cell(tr, p.msg_grid || p.grid || "", "mono");
      cell(tr, (p.via === "rf" ? "射频" : "网络") + (p.digi && p.digi.length ? " " + p.digi.join(" → ") : ""));
      cell(tr, p.text || "", "mono");
      var ops = cell(tr);
      var add = document.createElement("button");
      add.type = "button";
      add.className = "mini";
      add.textContent = "加入本轮";
      add.onclick = function () {
        api("/api/admin/station", "POST", {
          date: state.date, call: p.src, grid: p.msg_grid || p.grid, via: p.via, digi: p.digi,
          at: undefined, status: p.kind === "u" ? "confirmed" : "called"
        }).then(function (d) { showErr(d && d.error); refresh(); });
      };
      ops.appendChild(add);
      var ack = document.createElement("button");
      ack.type = "button";
      ack.className = "mini";
      ack.textContent = "回 ACK";
      ack.onclick = function () { doAck(p.src, ack); };
      ops.appendChild(ack);
      table.appendChild(tr);
    });
    box.appendChild(table);
  };

  var paintStations = function (stations, round) {    var box = $("stations");
    box.textContent = "";
    if (!round) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = "先开一轮。";
      box.appendChild(p);
      return;
    }
    if (!(stations || []).length) {
      var q = document.createElement("div");
      q.className = "empty";
      q.textContent = "这一轮还没有台站。";
      box.appendChild(q);
      return;
    }
    var names = { called: "只喊到", acked: "已回 ACK", confirmed: "已确认" };
    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["呼号", "网格", "路径", "时间", "状态", ""].forEach(function (label) {
      var th = document.createElement("th");
      th.textContent = label;
      head.appendChild(th);
    });
    table.appendChild(head);
    stations.forEach(function (s) {
      var tr = document.createElement("tr");
      cell(tr, s.call, "mono");
      cell(tr, s.grid || "", "mono");
      cell(tr, (s.via === "rf" ? "射频" : "网络") + (s.digi ? " " + s.digi.split(",").join(" → ") : ""));
      cell(tr, s.at || "", "mono");
      cell(tr, names[s.status] || s.status);
      var ops = cell(tr);
      var ack = document.createElement("button");
      ack.type = "button";
      ack.className = "mini";
      ack.textContent = "回 ACK";
      ack.onclick = function () { doAck(s.call, ack); };
      ops.appendChild(ack);
      var edit = document.createElement("button");
      edit.type = "button";
      edit.className = "mini";
      edit.textContent = "改";
      edit.onclick = function () {
        $("stCall").value = s.call;
        $("stGrid").value = s.grid || "";
        $("stVia").value = s.via || "";
        $("stDigi").value = s.digi || "";
        $("stAt").value = s.at || "";
        $("stStatus").value = s.status || "called";
      };
      ops.appendChild(edit);
      var del = document.createElement("button");
      del.type = "button";
      del.className = "mini hot";
      del.textContent = "删";
      del.onclick = function () {
        api("/api/admin/station/delete", "POST", { date: state.date, call: s.call })
          .then(function (d) { showErr(d && d.error); refresh(); });
      };
      ops.appendChild(del);
      table.appendChild(tr);
    });
    box.appendChild(table);
  };

  var paintOutbox = function (rows) {
    var box = $("outbox");
    box.textContent = "";
    if (!(rows || []).length) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = "还没发过。";
      box.appendChild(p);
      return;
    }
    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["时间", "发给", "报文", "结果"].forEach(function (label, i) {
      var th = document.createElement("th");
      th.textContent = label;
      if (i === 2) th.className = "mono";
      head.appendChild(th);
    });
    table.appendChild(head);
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      cell(tr, bjTime(r.created), "mono");
      cell(tr, r.dst, "mono");
      cell(tr, r.line, "mono");
      var res = r.error ? r.error : (r.sent ? "已发 " + bjTime(r.sent) : "排队中");
      if (r.acked) res = res + " · 对方已确认";
      cell(tr, res, r.error ? "bad" : "");
      table.appendChild(tr);
    });
    box.appendChild(table);
  };

  var doAck = function (call, btn) {
    api("/api/admin/ack", "POST", { date: state.round || state.date, call: call, text: "ACK" })
      .then(function (d) {
        if (!d || !d.ok) {
          var why = (d && d.error) || "没回成。";
          showErr(why);
          say(why, true);
          return;
        }
        showErr("");
        if (d.line) copy(d.line, btn);
        say((d.queued ? "发出去了 " : "记下了，口令没配，自己发 ") + d.line);
        refresh();
      });
  };

  $("roundForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var date = $("roundDate").value;
    api("/api/admin/round", "POST", { date: date, duty: $("dutyCall").value }).then(function (d) {
      if (!d || !d.ok) {
        var why = (d && d.error) || "开不起来。";
        showErr(why);
        say(why, true);
        return;
      }
      showErr("");
      state.date = date;
      say("现在在收的是 " + date + " 这轮，本轮呼号 " +
          ((d.round && d.round.duty) || "还没写") + "。");
      refresh();
    });
  });

  $("closeRound").addEventListener("click", function () {
    var date = $("roundDate").value;
    api("/api/admin/close", "POST", { date: date }).then(function (d) {
      if (!d || !d.ok) {
        var why = (d && d.error) || "收不起来。";
        showErr(why);
        say(why, true);
        return;
      }
      showErr("");
      var n = (d.archived || []).length;
      say(n ? (date + " 这轮收好了，" + n + " 份档案写在 " + state.archive)
            : (date + " 这轮收好了，没有新档案。"));
      refresh();
    });
  });

  $("roundPick").addEventListener("change", function () {
    state.date = $("roundPick").value;
    refresh();
  });

  $("auto").addEventListener("change", function () {
    var on = $("auto").checked;
    api("/api/admin/settings", "POST", { auto: on }).then(function (d) {
      if (!d || !d.ok) {
        var why = (d && d.error) || "改不动。";
        showErr(why);
        say(why, true);
        $("auto").checked = !on;
        return;
      }
      showErr("");
      state.auto = on;
      say(on ? "全自动开着：到点自己开轮收轮，喊到自己回 ACK，没回成的自己补。"
             : "全自动关了：开轮收轮与回 ACK 都自己点。");
      refresh();
    });
  });

  var exportUrl = function (what) {
    return "/api/admin/export?format=" + what.format + (what.what ? "&what=" + what.what : "") +
      "&date=" + encodeURIComponent(state.round || state.date) + "&token=" + encodeURIComponent(token);
  };

  $("exportBtn").addEventListener("click", function (e) {
    e.preventDefault();
    window.location = exportUrl({ format: "json" });
  });

  $("csvStBtn").addEventListener("click", function (e) {
    e.preventDefault();
    window.location = exportUrl({ format: "csv", what: "stations" });
  });

  $("csvPktBtn").addEventListener("click", function (e) {
    e.preventDefault();
    window.location = exportUrl({ format: "csv", what: "packets" });
  });

  $("archBtn").addEventListener("click", function () {
    api("/api/admin/archive", "POST", { date: state.round || state.date }).then(function (d) {
      if (!d || !d.ok) {
        var why = (d && d.error) || "归档没写成。";
        showErr(why);
        say(why, true);
        return;
      }
      showErr("");
      var names = (d.files || []).map(function (p) { return p.split("/").pop(); });
      say("归档好了：" + names.join(", ") + "，写在 " + d.dir);
    });
  });

  $("stForm").addEventListener("submit", function (e) {
    e.preventDefault();
    api("/api/admin/station", "POST", {
      date: state.date,
      call: $("stCall").value,
      grid: $("stGrid").value,
      via: $("stVia").value,
      digi: $("stDigi").value,
      at: $("stAt").value,
      status: $("stStatus").value
    }).then(function (d) { showErr(d && d.error); $("stCall").value = ""; refresh(); });
  });

  refresh();
  setInterval(function () {
    if (!lastSync) return;
    var ago = Math.max(0, Math.round((Date.now() - lastSync) / 1000));
    $("ago").textContent = "更新于 " + ago + " 秒前。";
  }, 1000);
  setInterval(function () {
    if ($("pause").checked) return;
    refresh();
  }, 10000);
})();
</script>
</body>
</html>
