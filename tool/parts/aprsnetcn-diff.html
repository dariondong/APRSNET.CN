  <section class="section" id="aprsnetcn-diff">
    <div class="section-head">
      <h2>与草案的三处差异</h2>
      <p>这台上线跑的版本有三处跟草案写得不一样。</p>
    </div>
    <div class="section-body">
      <ul class="fact-list">
        <li>
          <b>5.5 持久化</b>
          草案要求尽量避免把报文落库。位置按功能要留 24 小时，报文正文不落盘。
        </li>
        <li>
          <b>账号口令</b>
          草案没说这两段写在哪里。实现放在登录行末尾的 <code>auth</code> 段，不写这一段的老客户端照旧能用。
        </li>
        <li>
          <b>报文历史</b>
          草案没要求留。实现给了一个存档开关，默认关；打开后整行报文进库，默认留 72 小时，过期的在后台删掉。
        </li>
      </ul>
    </div>
  </section>
