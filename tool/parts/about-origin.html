  <section class="section" id="about-origin">
    <div class="section-head">
      <h2>这个站从哪来</h2>
      <p>先有客户端，后有这个站。</p>
    </div>
    <div class="section-body">
      <p class="prose">本站由 <a href="https://github.com/dariondong/APRSLocus" target="_blank" rel="noopener">APRSLocus</a> 项目衍生而来。那是一个用 Flutter 写的开源 APRS 客户端，安卓、iOS、Windows、macOS、Linux 和网页都能跑，源码在 GitHub 上，许可 GPLv3，官网是 <a href="https://aprslocus.theez.top/" target="_blank" rel="noopener">aprslocus.theez.top</a>。</p>
      <p class="prose">做客户端的时候，参数怎么填、频率与路径怎么选、报文里那些字段什么意思，这些中文资料是一点点攒出来的，原先散在聊天记录和笔记里。后来把它们理成能直接查的一套，就有了这个站。</p>
      <p class="prose">两边同一个作者在做。站是独立的：这里只管中文资料和查询工具，客户端的更新去 APRSLocus 那边看。</p>
    </div>
  </section>
