  <section class="section" id="proto-filter">
    <div class="section-head">
      <h2>第六章 APRS-IS 过滤器</h2>
      <p>客户端要看哪些包，用标准 APRS-IS 过滤器表达；过滤器只管自己这一条连接。</p>
    </div>
    <div class="section-body">
      <p class="prose"><b>6.1 过滤器支持</b> SERVER 应支持其明确声明兼容的标准 APRS-IS Filter 规则，使客户端能够按需接收相关 APRS 报文。</p>
      <p class="prose"><b>6.2 过滤器处理</b> SERVER 应检查过滤器语法、长度及计算开销。对于无法识别或超过资源限制的过滤器，可以拒绝应用。</p>
      <p class="prose"><b>6.3 过滤器隔离</b> 过滤器仅影响当前客户端的接收范围，不得改变其他客户端的订阅状态。未提交过滤器的客户端，应按照服务器公布的默认订阅策略接收数据。</p>
    </div>
  </section>
