  <section class="section" id="q-what">
    <div class="section-head">
      <h2>什么是 q 构造</h2>
      <p>包在互联网上转一圈，末尾会多出一小段 <code>,qXX,呼号</code>。那是服务器替它记的账：从哪个口进来、由谁送进来。</p>
    </div>
    <div class="section-body">
      <p class="prose">APRS-IS 加这一套东西，为的是几件事：认出包是从哪台服务器或者网关进的网；给将来的授权算法留个位置；发现环，并且自动把环挡掉。老的客户端和网关不用改任何东西，服务器那边自己认这套记号。</p>
      <p class="prose">要分清两类：一种由服务器自己写上去，记录包是怎么到它手里的；另一种由客户端或者网关写上去，说明包是从空中转上来的。同一个记号在两边可能出现，含义略有不同，下面分开列。</p>
    </div>
  </section>
