<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRSNETCN OA 倒计时</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f0ea">
<link rel="icon" type="image/png" href="https://aprsnet.cn/assets/favicon.png?v=5">
<style>
/* 一块能嵌在别处的读数，穿的是活动页白天那套：纸白底、墨字、细线分栏、赤红只给状态。
   跨站读不到 style.css 的变量，这里按 style.css 的 token 抄一份值，规则里仍然只写变量。 */
:root {
  color-scheme: light;
  --surface-1: #ffffff;
  --bg-1: #f2f0ea;
  --line: rgba(21, 24, 28, .20);
  --line-strong: rgba(21, 24, 28, .42);
  --text: #15181c;
  --text-dim: #4b535a;
  --text-faint: #6c747a;
  --hot: #b3141f;
  --font-sans: Helvetica, "Helvetica Neue", Inter, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg-1);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.em { display: flex; flex-direction: column; justify-content: center; min-height: 100%; padding: 20px 22px; }

/* 顶上那一行：活动名在左，当下状态在右 */
.em-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line-strong); }
.em-kicker { font-size: 13.5px; color: var(--text-faint); }
.em-state { margin-left: auto; font-size: 14.5px; font-weight: 700; color: var(--text-faint); }
.em-state.is-live { color: var(--hot); }

/* 左半边是钟，右半边是这一轮的数字与名字 */
.em-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(210px, .9fr); column-gap: 34px; align-items: center; margin-top: 16px; }
.em-label { font-size: 13.5px; color: var(--text-faint); }
.em-value { margin-top: 8px; font-family: var(--font-mono); font-size: clamp(32px, 6.2vw, 52px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--text); }
.em-note { margin-top: 10px; font-size: 13px; line-height: 1.6; color: var(--text-dim); }
.em-how { margin-top: 10px; font-size: 13px; line-height: 1.7; color: var(--text-dim); }
.em-how code { font-family: var(--font-mono); font-size: 12px; color: var(--text); background: var(--surface-1); border: 1px solid var(--line); padding: 0 4px; }
.em-go { margin-top: 12px; font-size: 13.5px; }
.em-go a { color: var(--hot); border-bottom: 1px solid currentColor; padding-bottom: 1px; }
.em-go a:hover, .em-go a:focus-visible { color: var(--hot-deep); }

.em-facts { border-top: 1px solid var(--line-strong); }
.em-facts > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.em-facts dt { min-width: 66px; font-size: 13px; color: var(--text-faint); }
.em-facts dd { margin: 0; font-family: var(--font-mono); font-size: 14.5px; color: var(--text); font-variant-numeric: tabular-nums; }

/* 框子矮的时候先撤次要的几行：公告卡是 16:9，APP 里只有 240 高 */
@media (max-height: 340px) {
  .em { padding: 14px 18px; }
  .em-note, .em-how { display: none; }
  .em-grid { grid-template-columns: minmax(0, 1fr) minmax(180px, .95fr); column-gap: 24px; margin-top: 12px; }
  .em-facts > div { padding: 6px 0; }
  .em-go { margin-top: 8px; }
}
/* 再矮就换成一条横带：左边是钟，右边三对数被细线分格，标签在上、数字在下，
   所有标签落在同一根线，数字也齐底。公告卡是 148 高，APP 里是 240。 */
@media (max-height: 258px) {
  .em { padding: 14px 20px; }
  .em-grid { display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: 0; row-gap: 8px; margin-top: 10px; }
  .em-go { display: none; }
  .em-label { font-size: 12.5px; }
  .em-value { margin-top: 4px; font-size: clamp(26px, 4vw, 34px); }
  .em-facts { display: flex; margin-left: auto; padding-left: 20px; border-top: 0; border-left: 1px solid var(--line-strong); }
  .em-facts > div { display: block; padding: 0 0 0 20px; border-bottom: 0; border-left: 1px solid var(--line); }
  .em-facts > div:first-child { padding-left: 0; border-left: 0; }
  .em-facts > div:not(.is-keep) { display: none; }
  .em-facts dt { min-width: 0; font-size: 12.5px; }
  .em-facts dd { margin-top: 4px; font-size: 16px; }
}
@media (max-width: 520px) {
  .em { padding-left: 16px; padding-right: 16px; }
  .em-state { margin-left: 0; }
  .em-grid { column-gap: 18px; }
  /* 窄屏还把横带收紧一点，英文那三对的字更长，不然会折到下一行 */
  .em-label { font-size: 12px; }
  .em-value { font-size: clamp(24px, 6vw, 30px); }
  .em-facts { padding-left: 12px; }
  .em-facts > div { padding-left: 12px; }
  .em-facts dt { font-size: 11.5px; }
  .em-facts dd { font-size: 15px; }
}
</style>
</head>

<body>

<main class="em" id="main" data-oa-clock data-clock-day=" 天" data-clock-days="周日,周一,周二,周三,周四,周五,周六"
      data-clock-label-start="距开始" data-clock-label-end="距结束">
  <div class="em-head">
    <p class="em-kicker">APRSNET.CN 独立活动 · APRSNETCN OA</p>
    <p class="em-state" data-em="state" data-em-before="未开始" data-em-live="进行中" data-em-over="结束了">—</p>
  </div>

  <div class="em-grid">
    <div>
      <p class="em-label" data-clock="label">距开始</p>
      <p class="em-value" data-clock="value">—</p>
      <p class="em-note">北京时间 周六 00:00 到 23:59 · UTC 周五 16:00 到周六 15:59</p>
      <p class="em-how">先发 <code>CQ CNNET 呼号 网格</code>，收到 ACK 再发 <code>U CNNET</code>。</p>
      <p class="em-go"><a href="https://aprsnet.cn/oa/">活动页 aprsnet.cn/oa</a></p>
    </div>

    <dl class="em-facts" data-em-roster="https://oa.aprsnet.cn/api/roster">
      <div><dt>场次</dt><dd data-em="round">—</dd></div>
      <div><dt>轮值呼号</dt><dd data-em="duty">BG7LZQ-2</dd></div>
      <div class="is-keep"><dt>台站</dt><dd data-em="stations">—</dd></div>
      <div class="is-keep"><dt>网格</dt><dd data-em="grids">—</dd></div>
      <div class="is-keep"><dt>走射频</dt><dd data-em="rf">—</dd></div>
      <div><dt>最近签到</dt><dd data-em="latest">—</dd></div>
    </dl>
  </div>
</main>

<script src="clock.js?v=1"></script>
<script src="embed.js?v=2"></script>
</body>
</html>
